# Standalone, webkit-free crate: reads Musubi's audit.db into the State the UI
# renders. Its own workspace so `cargo test` here pulls only rusqlite + serde
# (no Tauri/GUI deps) and runs in a headless environment.
[package]
name = "musubi-data"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
