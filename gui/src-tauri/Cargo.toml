[package]
name = "musubi-console"
version = "0.1.0"
description = "Musubi governance console — standalone desktop tool"
edition = "2021"

[lib]
name = "musubi_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
musubi-data = { path = "musubi-data" }

# musubi-data is a path dependency, not a workspace member — it stays a
# standalone crate so it can be tested without the Tauri/webkit toolchain.
