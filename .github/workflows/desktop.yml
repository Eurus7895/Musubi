name: Desktop build

# Builds the standalone Musubi Console Windows installer in the cloud so no
# local Rust/MSVC toolchain is needed.
#   - Manual run  (Actions > Desktop build > Run workflow) -> Windows installer
#     as a downloadable artifact on the run.
#   - Push a tag  (e.g. `v0.1.0`)                          -> a draft GitHub
#     Release with the Windows installer attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './gui/src-tauri -> target'

      - name: Install JS dependencies
        run: npm ci

      - name: Generate Windows icons
        working-directory: gui
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          args: --bundles msi,nsis
          # On a tag push, publish a draft Release with the installers attached.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Musubi Console ${{ github.ref_name }}'
          releaseBody: 'Standalone Musubi governance console. Download the Windows installer below.'
          releaseDraft: true
          includeUpdaterJson: false

      - name: Upload installers as artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: musubi-console-windows-latest
          if-no-files-found: warn
          path: |
            gui/src-tauri/target/release/bundle/**/*.msi
            gui/src-tauri/target/release/bundle/**/*.exe
