name: Desktop build

# Builds the standalone Musubi Console installers in the cloud so no local
# Rust/webview toolchain is needed.
#   • Manual run  (Actions ▸ Desktop build ▸ Run workflow) → installers as
#     downloadable artifacts on the run.
#   • Push a tag  (e.g. `v0.1.0`)                          → a draft GitHub
#     Release with the installers attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon (arm64)  → .dmg / .app
            args: '--bundles app,dmg'
          - platform: macos-13          # Intel (x86_64)         → .dmg / .app
            args: '--bundles app,dmg'
          - platform: ubuntu-22.04      # Linux                  → .deb / .AppImage
            args: '--bundles deb,appimage'
          - platform: windows-latest    # Windows                → .msi / .exe
            args: '--bundles msi,nsis'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            build-essential libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './gui/src-tauri -> target'

      - name: Install JS dependencies
        run: npm ci

      - name: Generate platform icons (.ico / .icns)
        working-directory: gui
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          args: ${{ matrix.args }}
          # On a tag push, publish a draft Release with the installers attached.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Musubi Console ${{ github.ref_name }}'
          releaseBody: 'Standalone Musubi governance console. Download the installer for your platform below.'
          releaseDraft: true
          includeUpdaterJson: false

      - name: Upload installers as artifacts (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: musubi-console-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            gui/src-tauri/target/release/bundle/**/*.dmg
            gui/src-tauri/target/release/bundle/**/*.app
            gui/src-tauri/target/release/bundle/**/*.deb
            gui/src-tauri/target/release/bundle/**/*.AppImage
            gui/src-tauri/target/release/bundle/**/*.msi
            gui/src-tauri/target/release/bundle/**/*.exe
