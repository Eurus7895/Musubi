# CI — Python + TypeScript test suites.
#
# Runs on every PR + push to dev / main. Two parallel jobs:
#   - python: pytest (745 tests) + ruff (lint, non-blocking)
#   - typescript: tsc --noEmit + npm test (236 tests)
#
# Lint runs with continue-on-error because there's pre-existing ruff debt
# in code that pre-dates the linter config. CI surfaces the warnings on
# every run but doesn't block PRs over it. New code authors are
# responsible for keeping their own touched files clean — see the
# per-PR test plans in the historical Phase G PRs for the pattern.
#
# Not in scope here:
#   - Building the PyInstaller binary (slow; a release workflow can
#     handle that separately).
#   - Packaging the .vsix via vsce (same — release-only).
#   - Branch protection rules. Set those in the GitHub UI under
#     Settings → Branches if you want CI required for merge.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel a stale run when a new commit lands on the same PR / branch.
# Saves CI minutes when you push a fixup right after the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────
  # Python harness — copilot-harness/
  # ────────────────────────────────────────────────────────────────────
  python:
    name: Python harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilot-harness
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install harness + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyyaml ruff

      - name: Lint — ruff (warnings only)
        # Pre-existing ruff debt in code that pre-dates the linter.
        # CI surfaces issues but doesn't block PRs. Fix in dedicated PRs.
        continue-on-error: true
        run: ruff check .

      - name: Test — pytest
        # `test_run_tests_passing_suite` invokes a python subprocess
        # whose PATH may not have pytest in some sandboxes; deselected
        # so the CI signal stays meaningful. The functionality it covers
        # (the `run_tests` executor helper) is exercised indirectly by
        # other tests.
        run: pytest tests/ -v --deselect tests/test_executor.py::test_run_tests_passing_suite

  # ────────────────────────────────────────────────────────────────────
  # TypeScript extension — copilot-harness-extension/
  # ────────────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilot-harness-extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: copilot-harness-extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck — tsc --noEmit
        run: npx tsc --noEmit

      - name: Test — node:test via tsx
        run: npm test
