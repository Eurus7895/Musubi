# CI — Python + TypeScript + Rust test suites.
#
# Runs on every PR + push to dev / main. Three parallel jobs:
#   - python: pytest (745 tests) + ruff (lint, non-blocking)
#   - typescript: tsc --noEmit + npm test (236 tests)
#   - rust: cargo test on the console's webkit-free audit.db reader
#     (gui/src-tauri/musubi-data). Headless — no Tauri/webview deps, so
#     it needs no system libs. The full desktop bundle is built separately
#     by .github/workflows/desktop.yml (release-only / manual).
#
# Lint runs with continue-on-error because there's pre-existing ruff debt
# in code that pre-dates the linter config. CI surfaces the warnings on
# every run but doesn't block PRs over it. New code authors are
# responsible for keeping their own touched files clean — see the
# per-PR test plans in the historical Phase G PRs for the pattern.
#
# Not in scope here:
#   - Building the PyInstaller binary (slow; a release workflow can
#     handle that separately).
#   - Packaging the .vsix via vsce (same — release-only).
#   - Branch protection rules. Set those in the GitHub UI under
#     Settings → Branches if you want CI required for merge.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Cancel a stale run when a new commit lands on the same PR / branch.
# Saves CI minutes when you push a fixup right after the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────
  # Python harness — musubi/
  # ────────────────────────────────────────────────────────────────────
  python:
    name: Python harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: musubi
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install harness + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pyyaml ruff mypy

      - name: Lint — ruff (warnings only)
        # Pre-existing ruff debt in code that pre-dates the linter.
        # CI surfaces issues but doesn't block PRs. Fix in dedicated PRs.
        continue-on-error: true
        run: ruff check .

      - name: Lint — musubi-tier tags (MVP item 7 / HI #9)
        # Every in-scope file (substrate code, agent.md, SKILL.md,
        # pipeline.yaml) must declare `musubi-tier:`. Ephemeral files
        # must also declare `expires-when:` + `cost-lever:`.
        # Hard-fail: this is the self-enforcement mechanism for HI #9.
        # Run from repo root, not the harness working-directory.
        working-directory: ${{ github.workspace }}
        run: python scripts/check_musubi_tier.py

      - name: Show env (debug)
        # Surfaces python version + interpreter path + key envs in the
        # log so a future CI failure can be reproduced locally without
        # guessing the runner state.
        run: |
          python --version
          which python
          python -c "import sys; print(sys.executable, sys.path)"
          pip list

      - name: Test — pytest
        # `test_run_tests_passing_suite` invokes a python subprocess
        # whose PATH may not have pytest in some sandboxes; deselected
        # so the CI signal stays meaningful. The functionality it covers
        # (the `run_tests` executor helper) is exercised indirectly by
        # other tests.
        # `--tb=short` keeps tracebacks scannable in the GH Actions log
        # viewer; `-x` stops on first failure so the relevant traceback
        # isn't buried under hundreds of dots.
        run: pytest tests/ -v --tb=short -x --deselect tests/test_executor.py::test_run_tests_passing_suite

  # ────────────────────────────────────────────────────────────────────
  # TypeScript extension — copilot-harness-extension/
  # ────────────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilot-harness-extension
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          # Node 22+ is required: `node --test 'src/**/*.test.ts'` uses
          # built-in glob expansion, which arrived in 22.0.0. Node 20
          # treats the pattern as a literal filename and exits with
          # "no such file" before any test runs.
          node-version: "22"
          cache: npm
          cache-dependency-path: copilot-harness-extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck — tsc --noEmit
        run: npx tsc --noEmit

      - name: Test — node:test via tsx
        run: npm test

  # ────────────────────────────────────────────────────────────────────
  # Rust console core — gui/src-tauri/musubi-data/
  # ────────────────────────────────────────────────────────────────────
  rust:
    name: Rust console core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/src-tauri/musubi-data
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'gui/src-tauri/musubi-data -> target'

      - name: Format — cargo fmt --check
        run: cargo fmt --check

      - name: Lint — cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test — cargo test
        # The audit.db reader (load_state / seed_demo) and its 5 unit
        # tests. Pure rusqlite + serde, no webkit, so it runs headless
        # without the Linux webview libs the desktop bundle needs.
        run: cargo test
