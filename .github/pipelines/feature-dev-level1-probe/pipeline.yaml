name: feature-dev-level1-probe
description: >
  Week 4 Day 5 — Level-1 single-generator probe. Collapses planner + designer +
  coder into ONE composite generator so we can measure first-attempt pass rate
  against the Level-2 baseline. Keeps the reviewer as a separate evaluator.
version: 0.1.0
level: 1

baseline_checks:
  - type: file_read
    path: src/
    error: "Cannot read src/ — ensure workspace root contains source."

generator:
  agent: agents/composite.agent.md
  skill: skills/python/SKILL.md
  output_schema: null

evaluator:
  # Re-use the production reviewer by relative path. Duplicating the reviewer
  # would let the probe and production drift apart — we only want the
  # generator side to differ.
  agent: ../feature-dev/agents/reviewer.agent.md
  skill: skills/code-review/SKILL.md

correction:
  max_retries: 3
  escalate_message: "Feature requires human review — max correction attempts exhausted"

# Measurement protocol for promoting or retaining Level 2 (see README.md).
probe:
  target_pass_rate: 0.80
  sample_size: 5
  baseline_pipeline: feature-dev
