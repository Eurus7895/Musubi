name: pipeline-builder
description: Author a NEW CopilotHarness pipeline — plan stages, design pipeline.yaml, write agent files, validate paths/schemas.
version: 1.0.0
level: 2

baseline_checks:
  - type: file_read
    path: .github/pipelines/
    error: "Cannot read .github/pipelines/ — pipeline-builder must run from a repo root that hosts CopilotHarness pipelines."

generator:
  agents:
    - name: planner
      agent: agents/planner.agent.md
      skill: null
    - name: designer
      agent: agents/designer.agent.md
      skill: null
    - name: coder
      agent: agents/coder.agent.md
      skill: null

evaluator:
  agent: agents/reviewer.agent.md
  skill: null

correction:
  max_retries: 3
  escalate_message: "Pipeline scaffold requires human review — max correction attempts exhausted"
