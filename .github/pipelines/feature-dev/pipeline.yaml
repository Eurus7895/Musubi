# musubi-tier: ephemeral
# expires-when: the 4-stage pipeline is dissolved (gated on item-10 eval data)
# cost-lever: deletes the whole pipeline runtime + its agent set
name: feature-dev
description: Guided feature development - plan to design to code to review
version: 2.0.0
level: 2

max_credits: 50
warn_at: 0.8

baseline_checks:
  - type: file_read
    path: src/
    error: "Cannot read src/ - ensure workspace root contains source."

stages:
  - agent: planner
    stage: plan
    max_iterations: 1
  - agent: designer
    stage: design
    max_iterations: 1
  - agent: coder
    stage: code
    spawns: [explorer, investigator]
    allowed_checks:
      - file_exists
      - file_created_or_modified
      - dom_count
      - dom_distinct_text
      - dom_text_set
      - lint_clean
    max_iterations: 3
  - agent: reviewer
    stage: review
    spawns: [reviewer-aux]
    max_iterations: 1
