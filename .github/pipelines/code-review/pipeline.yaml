# musubi-tier: ephemeral
# expires-when: the 4-stage pipeline is dissolved (gated on item-10 eval data)
# cost-lever: deletes the whole pipeline runtime + its agent set
name: code-review
description: Review a branch or PR - scope to findings to synthesis
version: 2.0.0
level: 2

max_credits: 20
warn_at: 0.8

baseline_checks:
  - type: file_read
    path: .git
    error: "Cannot read .git - code-review requires a git working tree."

stages:
  - agent: scoper
    stage: scope
    max_iterations: 1
  - agent: finder
    stage: findings
    max_iterations: 1
  - agent: synthesizer
    stage: synthesis
    spawns: [reviewer-aux]
    max_iterations: 1
