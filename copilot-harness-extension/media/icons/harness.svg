<!--
  CopilotHarness activity-bar icon.

  Abstraction: three inputs (planner, designer, coder) converge on one
  anchor node (the harness); one output leaves from the bottom
  (reviewer / shipped change). Pure shape, no lettering.

  Rules for VS Code activity-bar icons to render reliably:
  1. Every colored element sets fill/stroke = currentColor ITSELF — do
     not rely on inheritance from the root <svg>. Some builds of VS Code
     strip root-level stroke attributes before re-coloring.
  2. Include width + height on the root so the icon renders at its
     intrinsic size when scaled down to 24px / 16px.
  3. Use a single combined <path> for the lines (M/L segments). Per-
     element <line> tags with stroke="currentColor" also work but add
     DOM nodes that some renderers skip.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     width="24" height="24"
     fill="currentColor">
  <!-- Input + output branches as one stroked path. Set stroke directly
       so the renderer doesn't lose it through root-attribute stripping. -->
  <path d="M4.5 6 L12 12.5 M12 3 L12 12.5 M19.5 6 L12 12.5 M12 12.5 L12 20"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Nodes: all explicitly fill="currentColor" (no reliance on root). -->
  <circle cx="4.5"  cy="6"    r="1.35" fill="currentColor" />
  <circle cx="12"   cy="3"    r="1.35" fill="currentColor" />
  <circle cx="19.5" cy="6"    r="1.35" fill="currentColor" />
  <circle cx="12"   cy="12.5" r="2.1"  fill="currentColor" />
  <circle cx="12"   cy="20"   r="1.5"  fill="currentColor" />
</svg>
